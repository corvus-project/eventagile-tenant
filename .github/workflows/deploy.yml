name: Deploy SaaS

on:
  push:
    branches:
      - dev-release

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_PHP: ${{ github.repository_owner }}/eventagile-tenant-php
  IMAGE_NAME_NGINX: ${{ github.repository_owner }}/eventagile-tenant-nginx

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push PHP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/php.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_PHP }}:latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/nginx.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_NGINX }}:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to the new app directory on the server
            cd /app
            cat > .env <<'EOF'
            ${{ secrets.PROD_ENV_FILE }}
            EOF            
            docker compose pull saas-nginx saas-php saas-worker
            docker compose up -d saas-nginx saas-php saas-worker
