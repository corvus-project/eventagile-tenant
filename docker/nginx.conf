server {
    listen 80;
    server_name app.eventagile.com *.eventagile.com;
    root /var/www/html/public;

    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # The fastcgi_pass must match the PHP container name in docker-compose.yml
        # If this is the website repo, it should be 'website-php:9000'
        # If this is the SaaS repo, it would be 'saas-php:9000'
        fastcgi_pass saas-php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
