; Supervisor configuration for Laravel queue worker (save as /etc/supervisor/conf.d/eventagile-worker.conf)
[program:eventagile_app_queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/eventagile-app/current/artisan queue:work --sleep=3 --tries=3 --timeout=90
user=deploy
autostart=true
autorestart=true
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/eventagile-app/shared/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
