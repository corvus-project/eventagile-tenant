; PHP-FPM pool configuration tuned for 1GB server
; Save as /etc/php/8.4/fpm/pool.d/www.conf (adjust php version path)

[www]
user = www-data
group = www-data
listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
pm = dynamic
pm.max_children = 4
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

; Improve process handling
request_terminate_timeout = 300
rlimit_files = 131072
rlimit_core = 0
